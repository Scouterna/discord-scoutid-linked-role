name: Deploy

# Builds an image tagged with the commit SHA, pushes it to GHCR, then applies
# k8s/ to the `wsj27` namespace on Scouterna's shared AKS cluster.
#
# No Azure credentials are involved any more: the image goes to GHCR and the
# deploy goes to Kubernetes. Azure keeps only the DNS zone and the storage
# account the pod talks to at runtime.
#
# The test suite runs first, from .github/workflows/tests.yml, and nothing is
# built or applied unless it passes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time; a queued run supersedes an older one but never
  # cancels an apply in flight.
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/scouterna/discord-scoutid-linked-role
  # Pinned rather than trusting whatever the runner image ships, and matching
  # the devcontainer. `kubectl apply -k` embeds kustomize, but `kustomize edit`
  # needs the standalone binary.
  KUSTOMIZE_VERSION: 5.4.3

jobs:
  # Gate the deploy on a green suite. Defined in tests.yml so pull requests run
  # exactly the same job, and placed before the build so the reviewer approving
  # the prod environment sees the result first rather than after the fact.
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Requires a reviewer on the prod environment before anything is pushed.
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t "$IMAGE:${{ steps.tag.outputs.tag }}" .
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"

      - name: Install kustomize
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize
          kustomize version

      - name: Configure kubectl
        env:
          # Base64-encoded kubeconfig for the `github-deployer` service
          # account. That identity can touch discord-scoutid and nothing else
          # in the namespace — it cannot read Secrets or delete anything.
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$RUNNER_TEMP/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/.kube/config"
          chmod 600 "$RUNNER_TEMP/.kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> "$GITHUB_ENV"

      - name: Check for RBAC drift
        # k8s/rbac-github-deployer.yaml is the source of truth for CI's own
        # permissions, but it is applied by hand — the deployer has no rights on
        # `roles`, and one that could widen its own access would not be
        # restricted. Nothing keeps the two in step, and they drifted once
        # already. Warns, never fails: the test gate protects production from bad
        # code, and permission drift is not that.
        # Invoked through bash rather than executed directly. This repository is
        # edited from a Windows bind mount where git has core.filemode=false, so
        # a `chmod +x` never reaches a commit — the mode is recorded in the index
        # as well, but the workflow does not depend on it having survived.
        run: bash scripts/check-rbac-drift.sh

      - name: Apply manifests
        run: |
          # Edits the ephemeral checkout only; the committed kustomization.yaml
          # keeps its placeholder, so no tag in the repo can go stale.
          (cd k8s && kustomize edit set image "$IMAGE=$IMAGE:${{ steps.tag.outputs.tag }}")
          kubectl apply -k k8s/
          # The real gate. Fails on CrashLoopBackOff or ImagePullBackOff, and
          # with maxUnavailable: 0 a failing rollout never takes the old pods
          # down — so a bad image cannot break production.
          kubectl rollout status deploy/discord-scoutid --timeout=180s

      - name: Verify the new revision serves traffic
        run: |
          HOST=https://discord-scoutid.wsj27.scouterna.net
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$HOST/")
            if [ "$code" = "200" ]; then echo "healthy after ${i} attempt(s)"; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 10
          done
          echo "app did not return 200 within ~200s"; exit 1
