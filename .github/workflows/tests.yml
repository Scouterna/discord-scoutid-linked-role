name: Tests

# Defined once and used from two places: directly on pull requests and branch
# pushes, and via `workflow_call` from deploy.yml so a red suite blocks a deploy.
# Duplicating the job in both files would let them drift, and the copy that
# mattered would be the one nobody updated.
#
# No credentials are needed or granted. The repository is public, so fork and
# Dependabot pull requests get none — which is exactly why the tests must not
# depend on any. They stub Discord and ScoutNet, and use the Azurite emulator for
# storage.

on:
  pull_request:
  push:
    # main is covered through deploy.yml, which calls this workflow before it
    # builds. Running both here as well would double every run on main.
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint the workflows
        # A linter that only exists in the devcontainer gets skipped, and the
        # thing it protects — the workflow files — is exactly what cannot be
        # validated any other way than by pushing and watching. shellcheck is
        # preinstalled on the runner, and actionlint uses it for `run:` blocks.
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          actionlint -color

      - uses: actions/setup-node@v5
        with:
          # Matches the devcontainer and the runtime image, so a version-specific
          # failure shows up here rather than in the image.
          #
          # v5 rather than v4: GitHub now forces v4 to run on Node 24 anyway and
          # warns on every run about the Node 20 action runtime being deprecated.
          # That is the runtime the action itself uses — unrelated to the
          # node-version below, which is the one the tests run on.
          node-version: 24
          cache: npm

      - name: Lockfile must resolve from the public registry
        # Development happens behind a network that TLS-intercepts
        # registry.npmjs.org, so a gitignored .npmrc points npm at a reachable
        # mirror instead. npm rewrites the registry host at install time, so a
        # lockfile recording npmjs URLs serves both networks — but a lockfile
        # *generated* there records the mirror in every `resolved`, and this
        # runner cannot resolve that host.
        #
        # The check is host-agnostic on purpose: it asserts what must be true
        # rather than blacklisting a name. It also catches the case the obvious
        # version misses — the mirror answers tarball requests from a *different*
        # host than the one configured, so grepping for the configured registry
        # finds nothing.
        #
        # Runs before `npm ci` because the alternative symptom is ENOTFOUND on a
        # random transitive dependency, eighty seconds in, which reads as a
        # runner network glitch.
        run: |
          hosts=$(grep -o '"resolved": "https://[^/"]*' package-lock.json \
            | sed 's|.*https://||' | sort -u)
          bad=$(echo "$hosts" | grep -v '^registry\.npmjs\.org$' || true)
          if [ -n "$bad" ]; then
            echo "::error::package-lock.json resolves from a non-public registry: $bad"
            echo "Rewrite the host back before committing:"
            echo "  sed -i 's|https://<mirror-host>/npm/|https://registry.npmjs.org/|g' package-lock.json"
            exit 1
          fi
          echo "all resolved URLs point at registry.npmjs.org"

      - run: npm ci

      - name: Lint
        # ESLint config lives in eslint.config.js. The extension was already
        # installed in the devcontainer — it ships with the base image — and
        # threw `Could not find config file` for every file it touched until
        # that config existed. A linter that only runs in an editor is a linter
        # nobody's branch has to satisfy, which is the same reason actionlint
        # runs here and not only locally.
        #
        # Unlike the RBAC drift check, this fails the build rather than warning:
        # what it reports is caused by the very commit being built, and it is
        # fixed by editing that commit. Drift in something no code change caused
        # is the case for warning; this is not that.
        run: npm run lint

      - name: Formatting
        # `prettier --check`, not `--write`: CI must not push formatting back.
        # Fixed locally with `npm run format`. Markdown is excluded on purpose —
        # see .prettierignore.
        run: npm run format:check

      - name: Unit tests
        # No container, no network, no credentials — if this needs setup one day,
        # something has moved into the wrong suite.
        run: npm test

      - name: Start the Azurite table emulator
        # `docker run` rather than a `services:` block: the image's default command
        # starts all three storage services, and a service container cannot
        # override the command to start only the table one on 0.0.0.0.
        run: |
          docker run -d --name azurite -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite-table --tableHost 0.0.0.0
          # An unsigned request answering at all is enough to prove it is up; 403
          # is the expected reply and means the endpoint is live.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://127.0.0.1:10002/devstoreaccount1/Tables" || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "azurite answering with HTTP $code after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "azurite did not start within 30s"
          docker logs azurite
          exit 1

      - name: Integration tests
        # Set explicitly so the helper does not spend a DNS lookup on the
        # devcontainer's `azurite` hostname first.
        env:
          AZURITE_TABLE_HOST: 127.0.0.1:10002
        run: npm run test:integration

      - name: Azurite logs on failure
        if: failure()
        run: docker logs azurite || true
