apiVersion: v1
kind: ConfigMap
metadata:
  name: discord-scoutid-config
data:
  PORT: "3000"
  TABLE_NAME: scoutidlinks

  # Channel the verification event log is written to — #server-logg, owned by
  # Scouterna/wsj27-infra (discord/main.tf), where the id comes from
  # `terraform -chdir=discord output -raw server_log_channel_id`.
  #
  # Empty means the log is off and everything else behaves identically, so this
  # stays empty until the channel exists *and* the bot's role has the overwrite
  # granted there. The bot's role has no global View Channels, so the overwrite
  # is the only thing that lets it write: a 403 here means the overwrite is
  # missing, not that the token is wrong.
  LOG_CHANNEL_ID: "1539589887563669505"

  # Which member events the scheduled scan reports (memberscan-cronjob.yaml).
  # "off" or empty turns the scan off; it exits without touching anything.
  #
  # `roles` reports only changes made by someone other than the bot, read from the
  # Discord audit log. It needs View Audit Log on the bot's role — granted
  # 2026-08-19, so the role now carries 402653312 rather than 402653184. That bit
  # is set by hand in Server Settings → Roles, because the role is a managed
  # integration role Terraform does not own; if it is ever reset, this category
  # starts warning and skipping instead of failing.
  #
  # The filter is not cosmetic. Every one of the five most recent
  # MEMBER_ROLE_UPDATE entries in this guild was written by the bot itself, so
  # without it the category would be almost entirely the bot's own echo.
  LOG_MEMBER_EVENTS: join,leave,nickname,roles

  DISCORD_REDIRECT_URI: https://discord-scoutid.wsj27.scouterna.net/discord-oauth-callback
  DISCORD_VALIDATION_URL: https://discord-scoutid.wsj27.scouterna.net/linked-role
  SCOUTID_REDIRECT_URI: https://discord-scoutid.wsj27.scouterna.net/scoutid-oauth-callback

  # Not a secret: it is a plain env value on the Container App today. It lives
  # in secrets.tfvars only because that is where the Terraform variable sits.
  SCOUTNET_EVENT_ID: "43490"

  SCOUTNET_SCOUT_ROLE: scout
  SCOUTNET_EVENT_ROLE: WSJ-event
  # fee_id:kategori. Namnen bakom id:na finns i ScoutNet-svarets `labels.project_fee`
  # — kolla där innan ett nytt id mappas. 46628 ("CMT Special") lades till
  # 2026-08-16 efter att en länkad CMT:are blivit utan CMT-roll.
  # 25702 var tidigare `ist-direktresa` och gav en platt IST-Direktresa-roll.
  # Egen resa har numera patruller precis som rundresan, och patrullerna delar
  # numrering över båda grupperna — patrull 07 finns i exakt en av dem. Därför
  # räcker en enda IST-kategori: resegruppen syns inte i rollen alls utan i
  # vilken kategori patrullens kanal ligger, vilket wsj27-infra äger.
  SCOUTNET_FEE_ROLES: 25694:deltagare,27561:deltagare,25696:ist,25702:ist,33293:ledare,34850:ledare,27560:ledare,25695:ledare,25697:cmt,25693:cmt,46628:cmt
  SCOUTNET_DIVISION_ROLES: deltagare:88168:Deltagare-{div}:Deltagare-Väntande,ist:88168:IST-Patrull-{div}:IST-Väntande,ledare:107592:Ledare-{div}:Ledare-Väntande
  # Platta kategorimarkörer, utöver divisionsrollen: en ledare i avdelning 12 får
  # både `Ledare-12` och `Ledare`. De finns för AutoMod i wsj27-infra, som bara
  # kan *undanta* roller och max 20 av dem — "alla utom deltagare" hade krävt 158
  # per-avdelning roller, men blir sex med de här. `deltagare` har med flit ingen
  # rad: den saknade markören *är* det som gör att länkfiltret träffar dem.
  # `cmt` behöver ingen heller, den får rollen `CMT` av kategorinamnet.
  SCOUTNET_CATEGORY_ROLES: ledare:Ledare,ist:IST
  SCOUTNET_NICKNAME_SUFFIXES: deltagare:{div}:,ledare:AL{div}:AL,ist:IST-{div}:IST,cmt::CMT
