apiVersion: v1
kind: ConfigMap
metadata:
  name: discord-scoutid-config
data:
  PORT: "3000"
  TABLE_NAME: scoutidlinks

  # Channel the verification event log is written to. Empty means the log is
  # off and everything else behaves identically. The bot's role needs View
  # Channel + Send Messages there; a 403 means that permission is missing, not
  # that the token is wrong.
  LOG_CHANNEL_ID: ""

  # Which member events the scheduled scan reports (memberscan-cronjob.yaml).
  # "off" or empty turns the scan off; it exits without touching anything.
  #
  # `roles` reports only changes made by someone other than the bot, read from the
  # Discord audit log. It needs View Audit Log on the bot's role; without it the
  # category warns and is skipped instead of failing.
  LOG_MEMBER_EVENTS: join,leave,nickname,roles

  DISCORD_REDIRECT_URI: https://discord-scoutid.example.org/discord-oauth-callback
  DISCORD_VALIDATION_URL: https://discord-scoutid.example.org/linked-role
  SCOUTID_REDIRECT_URI: https://discord-scoutid.example.org/scoutid-oauth-callback

  # Empty: only the scout role is assigned. Not a secret.
  SCOUTNET_EVENT_ID: ""

  # Role lookup is case-insensitive, but the value is also member-facing: the
  # page after a half-finished link and every sentence about the role read the
  # name from here instead of spelling it out. So write it as it should read.
  SCOUTNET_SCOUT_ROLE: Scout
  SCOUTNET_EVENT_ROLE: participant
  # Member-facing names on the pages after a link (src/templates.js).
  DISCORD_SERVER_NAME: servern
  SCOUTNET_EVENT_NAME: eventet

  # fee_id:category. The names behind the ids are in the ScoutNet response's
  # `labels.project_fee` — check there before mapping a new id.
  SCOUTNET_FEE_ROLES: 1001:deltagare,1002:ledare,1003:funktionar
  # category:questionId:roleWithDiv:roleWithoutDiv. Each category reads its
  # division from its own ScoutNet question; {div} is the answer, zero-padded
  # to 2 digits when it is a number. Keep fixed text in the pattern: stale
  # roles are removed by matching it.
  SCOUTNET_DIVISION_ROLES: deltagare:5001:Deltagare-{div}:Deltagare-Väntande,ledare:5002:Ledare-{div}:Ledare-Väntande
  # Flat category roles, granted in addition to the division role: a leader in
  # division 12 gets both `Ledare-12` and `Avdelningsledare`. They let a Discord
  # feature that can only list a limited number of roles (AutoMod exemptions, for
  # one) address a whole category. `+` gives a category several markers. A
  # category left out gets no flat role.
  SCOUTNET_CATEGORY_ROLES: ledare:Avdelningsledare
  # category:category+category — which categories a member of the first sees in
  # `/adoption-scoutid`, at their own division: a leader in division 12 sees the
  # participants and leaders of 12. `*` sees everything, as an admin does.
  # Empty = the command is admin-only.
  SCOUTNET_ADOPTION_SCOPE: ledare:deltagare+ledare,funktionar:*
  # category:withDiv:withoutDiv (empty = no suffix). Produces e.g. "Ida
  # Sandholdt (12)" and "Erik Reiner (AL12)". Discord allows 32 characters;
  # `fitNickname` shortens the *name*, never the suffix.
  SCOUTNET_NICKNAME_SUFFIXES: deltagare:{div}:,ledare:AL{div}:AL,funktionar::F
