apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: discord-scoutid
  labels:
    app: discord-scoutid
  annotations:
    # These two are the whole certificate setup, assuming cert-manager is
    # installed: its ingress-shim creates and owns the Certificate from them, so
    # there is no certificate.yaml here. Adjust the issuer to your cluster.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-ingress-class: traefik
spec:
  # Name the class explicitly: where several ingress controllers run, an omitted
  # class can silently land on the wrong one. Adjust to your controller.
  ingressClassName: traefik
  tls:
    - hosts:
        - discord-scoutid.example.org
      secretName: discord-scoutid-tls
  rules:
    - host: discord-scoutid.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: discord-scoutid
                port:
                  number: 80
