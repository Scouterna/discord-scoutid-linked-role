apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-scoutid
  labels:
    app: discord-scoutid
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: discord-scoutid
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Keeps a warm replica through a rollout, so Discord's 3-second
      # interaction ACK is always met. Never scale to zero.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: discord-scoutid
    spec:
      # /interactions ACKs immediately, then finishes the real work ~1s later
      # in the background. Too short a grace period kills that work mid-rollout.
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          # Soft: two replicas are worth little if both sit on the same node.
          # Preferred, not required, so a full node can never block scheduling.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: discord-scoutid
      # The image already drops to the unprivileged `node` user (see the
      # Dockerfile). Stating it here as well is what makes it enforced rather
      # than merely intended: `runAsNonRoot` refuses to start a container whose
      # image was changed to run as root, and the rest of the block is what a
      # `restricted` Pod Security Standard requires. This namespace enforces no
      # PSS today, so none of it changes behaviour — it means the workload keeps
      # deploying unchanged on the day the shared cluster turns enforcement on.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # The root filesystem is read-only below, so give node a writable /tmp.
        # Nothing here writes files on purpose, but node itself may — and
        # discovering which library needs a scratch directory is not something
        # to do during an incident.
        - name: tmp
          emptyDir: {}
      containers:
        - name: app
          # Tag is set by CI (`kustomize edit set image`). Never :latest — it
          # makes rollouts and `rollout undo` ambiguous.
          image: ghcr.io/scouterna/discord-scoutid-linked-role:PLACEHOLDER-set-by-ci
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: discord-scoutid-config
            # Created imperatively, not by kustomize. See the migration plan, P4.
            - secretRef:
                name: discord-scoutid-secrets
          # Pod deletion and endpoint removal happen concurrently, so traefik
          # keeps routing here for a moment after termination starts. Without
          # this delay a rollout returns 502s (measured: 5 failures in 457
          # requests). Must stay well under terminationGracePeriodSeconds.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Sized against 93-97% actual node memory. Do not oversize.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Readiness checks Table Storage; liveness deliberately does not.
          #
          # A pod that cannot reach the table answers every interaction with an
          # error, so removing it from the Service is right — but *restarting* it
          # would not fix anything, and hanging liveness on a shared dependency
          # means one storage blip restarts every replica at once. See the
          # comment above the routes in src/server.js.
          #
          # failureThreshold 3 × 10s: roughly 30 seconds of unreachable storage
          # before a pod leaves the endpoint list, so a single slow request
          # cannot evict a healthy pod. The app caches the probe result for 5s,
          # so this costs about one table read per pod per 10 seconds.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
