# A generic example deployment. Set a namespace, the host in ingress.yaml, the values in configmap.yaml and the image tag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - deployment.yaml
  - pdb.yaml
  - service.yaml
  - ingress.yaml
  - backup-cronjob.yaml
  - memberscan-cronjob.yaml
  - refresh-cronjob.yaml

# backup-restore-job.yaml is deliberately NOT listed: it is a one-off, applied
# by hand when a restore is actually needed.
#

# The Secret `discord-scoutid-secrets` is deliberately absent: create it in the
# target cluster by whatever means you trust. It holds the credentials the app
# reads from .env.example (tokens, client secrets, TABLE_CONNECTION_STRING).

images:
  - name: ghcr.io/scouterna/discord-scoutid-linked-role
    # A placeholder: this example is built, never deployed as is. Pin a real tag
    # (the image is published as :<sha7>); an unset one fails loudly on
    # ImagePullBackOff rather than shipping something unintended:
    #
    #   IMG=ghcr.io/scouterna/discord-scoutid-linked-role
    #   kustomize edit set image "$IMG=$IMG:<sha7>"
    #
    newTag: PLACEHOLDER-pin-a-tag
